<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Mats</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#08090b" />
    <meta
      name="description"
      content="Materials engineering from counting upward: the history behind every idea, animated visuals, and practice."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;650;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint in the chosen reading theme straight away (see src/state/prefs.js).
      try {
        var rp = JSON.parse(localStorage.getItem('reading-prefs') || '{}');
        if (rp.theme) document.documentElement.dataset.theme = rp.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
